version: '3.9'
services:
  db:
    image: postgres:17.2-alpine3.21
    container_name: agriconnect-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agriconnect
    volumes:
      - agriconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agriconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: agriconnect-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/agriconnect
      DB_USERNAME: postgres
      DB_PASSWORD: password
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: AgriConnectDockerDevelopmentSecretKeyChangeMe123456789
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    container_name: agriconnect-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  agriconnect_pgdata:
